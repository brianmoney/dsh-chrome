<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>dsh-agent</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header id="bar">
      <span id="title">dsh-agent</span>
      <span id="status" data-kind=""></span>
      <button id="openTab" title="Open the dsh web UI in a normal tab. Needed for settings the panel's own connection cannot save — see the README.">Open in tab</button>
      <button id="stopCapture" title="Stop capturing HTTP for the current tab">Stop capture</button>
      <button id="settings" title="Change the dsh web UI address">Settings</button>
    </header>
    <iframe id="dshFrame" src="about:blank" allow="clipboard-read; clipboard-write"></iframe>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
